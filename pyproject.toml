[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "database-bootstrap"
version = "0.2.0"
description = "Job que reconstrói o grafo Neo4j feeddb a partir do PostgreSQL do api-core"
requires-python = ">=3.12"
dependencies = [
    "neo4j==6.2.0",
    "psycopg[binary]==3.3.6",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "ruff==0.13.3",
]

[project.scripts]
database-bootstrap = "database_bootstrap.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
database_bootstrap = ["queries/**/*.sql", "queries/**/*.cypher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: exige Neo4j e PostgreSQL acessíveis por variáveis de ambiente",
]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = ["src/database_bootstrap"]

[tool.coverage.report]
show_missing = true
skip_covered = true
