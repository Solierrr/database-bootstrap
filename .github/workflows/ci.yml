name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: requirements.dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.dev.txt

      - name: Build and smoke-test container
        run: |
          docker build --tag database-bootstrap:ci .
          docker run --rm --workdir /app/src --entrypoint python database-bootstrap:ci -c "import main"
          set +e
          docker run --rm database-bootstrap:ci
          status=$?
          set -e
          test "$status" -eq 64
